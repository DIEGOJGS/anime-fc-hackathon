<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="style.css" />
    <title>Anime FC – El Estadio de los Personajes</title>
</head>
<body>
    <header>
        <h1>ANIME FC</h1>
        <p class="subtitle">Donde los héroes del anime se convierten en estrellas del fútbol</p>
    </header>

    <div class="stadium-bg">
        <div class="ball"></div>
    </div>
<section class="teams">
    <h2 class="team-title">Equipo del Fuego</h2>
    <div class="players">
        <div class="player-card">
            <div class="player-img">N</div>
            <h3 class="player-name">Naruto Uzumaki</h3>
            <p class="player-role">Portero</p>
        </div>

        <div class="player-card">
            <div class="player-img">L</div>
            <h3 class="player-name">Monkey D. Luffy</h3>
            <p class="player-role">Delantero</p>
        </div>

        <div class="player-card">
            <div class="player-img">G</div>
            <h3 class="player-name">Goku</h3>
            <p class="player-role">Centrocampista</p>
        </div>
    </div>
</section>

<footer>
    <p>✨ Proyecto para el Hackathon "Web Design Project – No Javascript" ✨</p>
</footer>
</body>
</html>
